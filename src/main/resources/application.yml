spring:
  application:
    name: sentinelops-ai
  datasource:
    url: ${DB_URL:jdbc:postgresql://localhost:5433/sentinelops}
    username: ${DB_USER:sentinelops}
    password: ${DB_PASSWORD:sentinelops}
  jpa:
    hibernate:
      ddl-auto: validate
    open-in-view: false
  flyway:
    enabled: true
management:
  endpoints:
    web:
      exposure:
        include: health,info,metrics
springdoc:
  swagger-ui:
    path: /swagger-ui.html
