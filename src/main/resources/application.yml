spring:
  application:
    name: sentinelops-ai
  datasource:
    url: ${DB_URL:jdbc:postgresql://localhost:5433/sentinelops}
    username: ${DB_USER:sentinelops}
    password: ${DB_PASSWORD:sentinelops}
  jpa:
    hibernate:
      ddl-auto: validate
    open-in-view: false
  flyway:
    enabled: true

management:
  endpoints:
    web:
      exposure:
        include: health,info,metrics,prometheus
  metrics:
    tags:
      application: ${spring.application.name}
  tracing:
    sampling:
      probability: ${TRACING_SAMPLING_PROBABILITY:1.0}
  otlp:
    tracing:
      endpoint: ${OTEL_EXPORTER_OTLP_ENDPOINT:http://localhost:4318/v1/traces}

springdoc:
  swagger-ui:
    path: /swagger-ui.html

sentinelops:
  ai:
    mode: ${SENTINELOPS_AI_MODE:deterministic}
