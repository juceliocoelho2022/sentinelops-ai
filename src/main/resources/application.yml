spring:
  application:
    name: sentinelops-ai
  datasource:
    url: ${DB_URL:jdbc:postgresql://localhost:5433/sentinelops}
    username: ${DB_USER:sentinelops}
    password: ${DB_PASSWORD:sentinelops}
  jpa:
    hibernate:
      ddl-auto: validate
    open-in-view: false
  flyway:
    enabled: true
  ai:
    model:
      chat: ${SPRING_AI_MODEL_CHAT:none}
      embedding: none
      audio:
        speech: none
        transcription: none
      image: none
      moderation: none
    openai:
      api-key: ${OPENAI_API_KEY:}
      chat:
        options:
          model: ${OPENAI_MODEL:gpt-4o-mini}

management:
  endpoints:
    web:
      exposure:
        include: health,info,metrics,prometheus
  metrics:
    tags:
      application: ${spring.application.name}
  tracing:
    sampling:
      probability: ${TRACING_SAMPLING_PROBABILITY:1.0}
  otlp:
    tracing:
      endpoint: ${OTEL_EXPORTER_OTLP_ENDPOINT:http://localhost:4318/v1/traces}

springdoc:
  swagger-ui:
    path: /swagger-ui.html

sentinelops:
  security:
    local-jwt:
      enabled: ${SENTINELOPS_LOCAL_JWT_ENABLED:false}
      secret: ${SENTINELOPS_LOCAL_JWT_SECRET:}
  ai:
    mode: ${SENTINELOPS_AI_MODE:deterministic}
